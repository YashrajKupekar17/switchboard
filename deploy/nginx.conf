# Load balancer in front of the gateway copies (DECISIONS.md M2).
events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;  # Docker's internal DNS, re-asked every 5 s

    upstream gateway {
        zone gateway 64k;
        server gateway:8000 resolve;  # "gateway" resolves to every copy; requests go round-robin
        keepalive 32;                 # reuse connections to the copies instead of opening one per request
    }

    server {
        listen 8000;

        location = /metrics {
            return 404;  # metrics are for Prometheus on the internal network, not for clients (J3)
        }

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";  # needed for keepalive to the copies
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;             # streams: pass each chunk on as it arrives, don't collect them
            proxy_read_timeout 120s;         # longer than the gateway's own 60 s provider timeout
        }
    }
}
