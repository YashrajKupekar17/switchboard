# Runs the test suite on every push and pull request. The tests need no services: Redis and Postgres are faked
# in tests/conftest.py, and no test reaches a real provider.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is what the Docker image runs; 3.9 is the local venv, so a dependency that drops it shows up here
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
