global:
  scrape_interval: 15s  # how often Prometheus reads /metrics

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    # Every gateway copy separately, never through the load balancer: through it, each scrape would hit a
    # random copy. Docker's DNS returns one address per copy for the name "gateway".
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 8000
        refresh_interval: 15s
