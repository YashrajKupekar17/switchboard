# Owned by the platform team. Clients only ever see the names under `models`.
#
# A provider's `type` says which API it speaks: "openai" (the default; also Groq, Ollama, vLLM...)
# or "anthropic" (translated by anthropic_adapter.py). The gateway refuses to start if an
# `api_key_env` variable is missing, so leave a provider commented out until its key is in .env.

providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY   # name of the env var, never the key itself
  ollama:
    base_url: http://localhost:11434/v1   # local, no key needed
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  # anthropic:                            # uncomment once ANTHROPIC_API_KEY is in .env
  #   type: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key_env: ANTHROPIC_API_KEY

# What a client can ask for -> ordered list of where to try it.
# Fallback targets are paired by tier (a cheap model falls back to a cheap model).
models:
  gpt-4o-mini:
    - provider: openai
      model: gpt-4o-mini
    - provider: groq
      model: openai/gpt-oss-20b
    # - provider: anthropic
    #   model: claude-haiku-5-5
    - provider: ollama
      model: llama3.2
  gpt-4o:
    - provider: openai
      model: gpt-4o
    # - provider: anthropic
    #   model: claude-sonnet-5-5
    - provider: groq
      model: openai/gpt-oss-120b

  # Tier names: clients who don't care about the vendor ask for a tier; we pick the model.
  fast:
    - provider: openai
      model: gpt-4o-mini
    - provider: groq
      model: openai/gpt-oss-20b
    # - provider: anthropic
    #   model: claude-haiku-5-5
    - provider: ollama
      model: llama3.2
  strong:
    - provider: openai
      model: gpt-4o
    # - provider: anthropic
    #   model: claude-sonnet-5-5
    - provider: groq
      model: openai/gpt-oss-120b

# Routes (DECISIONS.md P): a client that asks for `auto` lets the gateway pick the model. Asking for a model
# by name always gets that model. The pick is made from the request alone, before any model is called:
# `default` unless any rule under `upgrade_if` matches. The rules are the same for every team, and they're
# starting guesses, not measured yet. Every response says what was picked and why (x-gateway-routed-to,
# x-gateway-route-reason).
routes:
  auto:
    default: fast
    upgrade_to: strong
    upgrade_if:
      has_tools: true          # the request offers tools
      min_turns: 6             # 6+ user messages in the conversation
      min_prompt_tokens: 3000  # a long prompt (estimated tokens)
    # Shadow mode (DECISIONS.md P5): for this share of requests, after the answer is sent, also ask the other
    # model and save both answers, for scripts/route_eval.py to compare. The platform pays for these calls:
    # they don't count against a team's budget or rate limit (gateway_route_shadow_usd_total shows the cost).
    shadow_sample: 0.05

# Which model names each team may ask for (DECISIONS.md T4). "*" means any; asking for anything else gets a 403
# model_not_allowed. A team allowed `auto` must be allowed its default; if it isn't allowed the upgrade, auto keeps it
# on the default (x-gateway-route-reason: upgrade_not_allowed). Access is by the name a client asks for: fallback
# targets behind that name don't need listing. A key's own limits and budget are per key, in Postgres (scripts/keys.py).
access:
  default: {models: "*"}
  teams:
    replay: {models: [gpt-4o-mini, fast]}   # scripts/cache_replay.py: the cheap model is all it needs

# Per-team limits (DECISIONS.md K). Each team has two buckets: requests per minute and tokens per minute.
# A bucket holds one minute's worth, so a team can burst up to its limit, then gets a steady rate.
rate_limits:
  default: {rpm: 60, tpm: 100000}
  teams:                      # overrides; a team not listed here gets the default
    search: {rpm: 600, tpm: 1000000}
    replay: {rpm: 600, tpm: 1000000}   # scripts/cache_replay.py
  gateway_copies: 3           # while Redis is down, each copy enforces limit / gateway_copies on its own
                              # (keep in sync with `replicas` in docker-compose.yml)

# USD per 1M tokens, copied from each provider's pricing page on 2026-11-09. Every deployment used
# under `models` needs one, or the gateway won't start. cached_input and cache_write default to input.
prices:
  openai/gpt-4o-mini:     {input: 0.15,  cached_input: 0.075,  output: 0.60}
  openai/gpt-4o:          {input: 2.50,  cached_input: 1.25,   output: 10.00}
  groq/openai/gpt-oss-20b:  {input: 0.075, cached_input: 0.0375, output: 0.30}
  groq/openai/gpt-oss-120b: {input: 0.15,  cached_input: 0.075,  output: 0.60}
  ollama/llama3.2:        {input: 0, output: 0}   # runs on our own machine: no per-token bill (the GPU isn't free)
  # Anthropic: 5-minute cache writes cost 1.25x input. Haiku 5.5 costs 5x more for prompts over
  # 100k tokens ($0.50 / $2.50), which this table doesn't model yet.
  anthropic/claude-haiku-5-5:  {input: 0.10, cached_input: 0.01, cache_write: 0.125, output: 0.50}
  anthropic/claude-sonnet-5-5: {input: 2.00, cached_input: 0.10, cache_write: 2.50,  output: 10.00}

# Monthly budgets per team, reset on the 1st at 00:00 UTC (DECISIONS.md L).
# Past soft_usd: a warning and an alert, requests still work. At max_usd: requests get 429 budget_exceeded.
budgets:
  default: {soft_usd: 50, max_usd: 60}
  teams:
    search: {soft_usd: 500, max_usd: 600}

# Exact response cache (DECISIONS.md N). Off unless a team turns it on: a cached answer to a creative
# prompt would stop that team ever getting a new one. Per request, the x-gateway-cache: on|off header
# overrides this, and x-gateway-cache-ttl: <seconds> sets how long the answer is kept.
#
# semantic (DECISIONS.md O): also serve a stored answer to a question that means the same.
#   off    = exact matches only (the default)
#   shadow = look for a match but never serve it; save would-be hits for scripts/semantic_eval.py
#   on     = matches with similarity >= threshold go to a judge (gpt-4o-mini) that reads both questions;
#            only those it calls the same question are served. The similarity alone can't decide (O7, O10).
cache:
  default: {enabled: false, ttl: 3600, semantic: "off", threshold: 0.70}
  teams:
    search: {enabled: true, semantic: shadow}
    replay: {enabled: true, semantic: "on"}   # scripts/cache_replay.py: what caching saves a support bot

# Capacity of each gateway copy (DECISIONS.md Q). Measured with loadtest/, on one CPU per copy.
# Calls to providers this copy can have open at once. Each one is open for the whole answer, so you need about
# requests/s x seconds per answer (Little's Law): 200/s x 5 s = 1,000. When all are busy, a request waits up to
# 1 s for one, then gets 503 gateway_overloaded; that's our limit, so the provider's breaker isn't touched (Q2).
max_connections: 1000
# One provider's share of those (a bulkhead, DECISIONS.md R2). A provider that turns slow holds its connections for
# as long as it's slow; past its share, requests go to the next target at once instead of waiting.
max_connections_per_provider: 600
# An answer that made us wait longer than this (to the first token, or for a whole answer, less 50 ms per output
# token for writing it) counts as a failure for the provider's breaker, though the client still gets it (R3).
# Five in a row and traffic moves to the fallback. 0 turns it off.
slow_call_s: 10
# Load shedding (Q5): if, for 100 ms, even the fastest request spent longer than this in the gateway's own part
# (before calling the provider), the next 100 ms of chat requests get 503 at once. Normally that part takes 1-3 ms.
# 0 turns it off.
overload_target_ms: 100
