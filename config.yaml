# Owned by the platform team. Clients only ever see the names under `models`.
#
# A provider's `type` says which API it speaks: "openai" (the default; also Groq, Ollama, vLLM...)
# or "anthropic" (translated by anthropic_adapter.py). The gateway refuses to start if an
# `api_key_env` variable is missing, so leave a provider commented out until its key is in .env.

providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY   # name of the env var, never the key itself
  ollama:
    base_url: http://localhost:11434/v1   # local, no key needed
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  # anthropic:                            # uncomment once ANTHROPIC_API_KEY is in .env
  #   type: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key_env: ANTHROPIC_API_KEY

# What a client can ask for -> ordered list of where to try it.
# Fallback targets are paired by tier (a cheap model falls back to a cheap model).
models:
  gpt-4o-mini:
    - provider: openai
      model: gpt-4o-mini
    - provider: groq
      model: openai/gpt-oss-20b
    # - provider: anthropic
    #   model: claude-haiku-5-5
    - provider: ollama
      model: llama3.2
  gpt-4o:
    - provider: openai
      model: gpt-4o
    # - provider: anthropic
    #   model: claude-sonnet-5-5
    - provider: groq
      model: openai/gpt-oss-120b

  # Tier names: clients who don't care about the vendor ask for a tier; we pick the model.
  fast:
    - provider: openai
      model: gpt-4o-mini
    - provider: groq
      model: openai/gpt-oss-20b
    # - provider: anthropic
    #   model: claude-haiku-5-5
    - provider: ollama
      model: llama3.2
  strong:
    - provider: openai
      model: gpt-4o
    # - provider: anthropic
    #   model: claude-sonnet-5-5
    - provider: groq
      model: openai/gpt-oss-120b

# Per-team limits (DECISIONS.md K). Each team has two buckets: requests per minute and tokens per minute.
# A bucket holds one minute's worth, so a team can burst up to its limit, then gets a steady rate.
rate_limits:
  default: {rpm: 60, tpm: 100000}
  teams:                      # overrides; a team not listed here gets the default
    search: {rpm: 600, tpm: 1000000}
  gateway_copies: 3           # while Redis is down, each copy enforces limit / gateway_copies on its own
                              # (keep in sync with `replicas` in docker-compose.yml)

# USD per 1M tokens, copied from each provider's pricing page on 2026-11-09. Every deployment used
# under `models` needs one, or the gateway won't start. cached_input and cache_write default to input.
prices:
  openai/gpt-4o-mini:     {input: 0.15,  cached_input: 0.075,  output: 0.60}
  openai/gpt-4o:          {input: 2.50,  cached_input: 1.25,   output: 10.00}
  groq/openai/gpt-oss-20b:  {input: 0.075, cached_input: 0.0375, output: 0.30}
  groq/openai/gpt-oss-120b: {input: 0.15,  cached_input: 0.075,  output: 0.60}
  ollama/llama3.2:        {input: 0, output: 0}   # runs on our own machine: no per-token bill (the GPU isn't free)
  # Anthropic: 5-minute cache writes cost 1.25x input. Haiku 5.5 costs 5x more for prompts over
  # 100k tokens ($0.50 / $2.50), which this table doesn't model yet.
  anthropic/claude-haiku-5-5:  {input: 0.10, cached_input: 0.01, cache_write: 0.125, output: 0.50}
  anthropic/claude-sonnet-5-5: {input: 2.00, cached_input: 0.10, cache_write: 2.50,  output: 10.00}

# Monthly budgets per team, reset on the 1st at 00:00 UTC (DECISIONS.md L).
# Past soft_usd: a warning and an alert, requests still work. At max_usd: requests get 429 budget_exceeded.
budgets:
  default: {soft_usd: 50, max_usd: 60}
  teams:
    search: {soft_usd: 500, max_usd: 600}
