providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  ollama:
    base_url: http://ollama.test/v1

models:
  gpt-4o-mini:
    - provider: openai
      model: gpt-4o-mini
    - provider: ollama
      model: llama3.2
  gpt-4o:
    - provider: openai
      model: gpt-4o
    - provider: ollama
      model: llama3.2
  local-small:
    - provider: ollama
      model: llama3.2
