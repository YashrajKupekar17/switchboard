providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  ollama:
    base_url: http://ollama.test/v1
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY

models:
  gpt-4o-mini:
    - provider: openai
      model: gpt-4o-mini
    - provider: ollama
      model: llama3.2
  gpt-4o:
    - provider: openai
      model: gpt-4o
    - provider: ollama
      model: llama3.2
  local-small:
    - provider: ollama
      model: llama3.2
  claude-small:
    - provider: anthropic
      model: claude-haiku-5-5
  claude-then-ollama:
    - provider: anthropic
      model: claude-haiku-5-5
    - provider: ollama
      model: llama3.2
  openai-then-claude:
    - provider: openai
      model: gpt-4o-mini
    - provider: anthropic
      model: claude-haiku-5-5

rate_limits:
  default: {rpm: 1000, tpm: 1000000}  # high enough that only the rate limit tests ever hit it
  gateway_copies: 2

prices:
  openai/gpt-4o-mini: {input: 0.15, cached_input: 0.075, output: 0.60}
  openai/gpt-4o: {input: 2.50, cached_input: 1.25, output: 10.00}
  ollama/llama3.2: {input: 0, output: 0}
  anthropic/claude-haiku-5-5: {input: 0.10, cached_input: 0.01, cache_write: 0.125, output: 0.50}

budgets:
  default: {soft_usd: 1000, max_usd: 1000}  # high enough that only the budget tests ever hit it
